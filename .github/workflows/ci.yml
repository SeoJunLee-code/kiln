name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The optional physics backend: one pinned package, used by the rigid-body example.
      - run: npm ci --prefix backends/rapier --ignore-scripts --no-audit --no-fund
      - run: npm test
      # The same scene and input must give the same state hash on every OS.
      - name: Check example hashes
        shell: bash
        run: node scripts/hashes.ts --check
