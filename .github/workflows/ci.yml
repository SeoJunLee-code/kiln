name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The optional physics backend: one pinned package, used by the rigid-body example.
      - run: npm ci --prefix backends/rapier --ignore-scripts --no-audit --no-fund
      # One test file at a time on Windows: its runners starve when headless Chrome and the
      # engine's own threads run beside each other, and time limits in the tests then expire.
      - run: node --test ${{ runner.os == 'Windows' && '--test-concurrency=1' || '' }} tests/*.test.ts
        shell: bash
      # The same scene and input must give the same state hash on every OS.
      - name: Check example hashes
        shell: bash
        run: node scripts/hashes.ts --check

  # `kiln desktop` needs a Node that can build single executables (25.5 or newer).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The examples folder is built whole, and one of its scenes names the backend.
      - run: npm ci --prefix backends/rapier --ignore-scripts --no-audit --no-fund
      - run: node --test tests/desktop.test.ts
