name: demo

# Builds the examples into a static folder with `kiln build` and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The optional physics backend: one pinned package, used by the rigid-body example.
      - run: npm ci --prefix backends/rapier --ignore-scripts --no-audit --no-fund
      - run: node src/cli.ts build examples/arena3d.kiln --out site --panel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
