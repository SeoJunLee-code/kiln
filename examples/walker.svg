<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 20">
  <!-- Four frames of 16x20, looking right: 0 standing, 1..3 a walk cycle. -->
  <g id="f0">
    <rect x="2" y="1" width="12" height="10" rx="3" fill="#f2c14e"/>
    <rect x="8" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="12" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="3" y="11" width="10" height="6" rx="1" fill="#4e8df2"/>
    <rect x="4" y="17" width="3" height="3" fill="#2c313a"/>
    <rect x="9" y="17" width="3" height="3" fill="#2c313a"/>
  </g>
  <g id="f1" transform="translate(16 0)">
    <rect x="2" y="1" width="12" height="10" rx="3" fill="#f2c14e"/>
    <rect x="8" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="12" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="3" y="11" width="10" height="6" rx="1" fill="#4e8df2"/>
    <rect x="1" y="17" width="3" height="2" fill="#2c313a"/>
    <rect x="12" y="17" width="3" height="3" fill="#2c313a"/>
  </g>
  <g id="f2" transform="translate(32 0)">
    <rect x="2" y="0" width="12" height="10" rx="3" fill="#f2c14e"/>
    <rect x="8" y="3" width="2" height="3" fill="#14161a"/>
    <rect x="12" y="3" width="2" height="3" fill="#14161a"/>
    <rect x="3" y="10" width="10" height="6" rx="1" fill="#4e8df2"/>
    <rect x="6" y="16" width="4" height="4" fill="#2c313a"/>
  </g>
  <g id="f3" transform="translate(48 0)">
    <rect x="2" y="1" width="12" height="10" rx="3" fill="#f2c14e"/>
    <rect x="8" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="12" y="4" width="2" height="3" fill="#14161a"/>
    <rect x="3" y="11" width="10" height="6" rx="1" fill="#4e8df2"/>
    <rect x="2" y="17" width="3" height="3" fill="#2c313a"/>
    <rect x="11" y="17" width="3" height="2" fill="#2c313a"/>
  </g>
</svg>
